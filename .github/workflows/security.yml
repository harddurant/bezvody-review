name: security
on:
  push:
  pull_request:
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история для скана прошлых коммитов
      - name: gitleaks (секреты в коде и истории)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Сканер скиллов переехал в skills.yml (23.09): он ставит uv и Skillspector
  # на каждый пуш (~3 минуты), а скиллы меняются раз в неделю. Теперь он
  # запускается только когда меняются .claude/skills, скрипт или базовая линия.

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # Тот же гейт, что buildCommand на Vercel. Раньше в CI жил только smoke,
      # то есть три проверки из четырёх запускались только у меня на машине.
      - name: тест-гейт (smoke + field + kitchen + matrix + build)
        run: node tests/smoke.js && node tests/field.js && node tests/kitchen.js && node tests/matrix.js && node tests/build.js

  # ── НАСТОЯЩИЙ БРАУЗЕР В CI (31.08) ──
  # Вопрос владельца: «почему до меня долетает нерабочая версия и какой
  # инструмент это прекратит». Вот он. browser.js и dirty.js ловят ровно то,
  # чего не видит фейковый DOM — положение полей при клавиатуре, пустые
  # экраны, крашь на битой базе, — но в деплой-гейт не входят: на Vercel
  # браузера нет. Значит они запускались тогда, когда я про них вспомнил.
  # В GitHub Actions Chromium есть. Теперь они запускаются на КАЖДЫЙ пуш
  # любой ветки, и забыть их нельзя: красный прогон виден в ветке до того,
  # как владелец возьмёт телефон.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Node 22, не 20 (23.09): browser.js и dirty.js говорят с браузером через
      # глобальный WebSocket, который появился в Node 22. В Node 20 его нет,
      # `new WebSocket` бросал ReferenceError внутри try/catch, и прогон
      # сообщал «вкладки не отдал» — три недели красных прогонов и три
      # догадки про браузер были мимо: браузер был исправен, не было сокета.
      # Локальный стенд ходит на Node 22, поэтому там всё работало.
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # ── БРАУЗЕР ДЛЯ ПРОГОНА (переделано 11.09) ──
      # Было: apt ставил chromium-browser. На Ubuntu 24.04 это ТРАНЗИТНЫЙ
      # пакет к snap, а у snap свой изолированный /tmp и своё окружение:
      # браузер стартовал, печатал версию и не отдавал вкладку по отладочному
      # порту. Прогон при этом выходил зелёным, ничего не проверив, — дыру
      # нашли только 11.09, когда тест научили падать вслух.
      # Теперь берём Google Chrome, который на раннере УЖЕ установлен, и
      # ставим что-либо только если его нет.
      # ── БРАУЗЕР, КОТОРЫЙ КОНТРОЛИРУЕМ МЫ (11.09) ──
      # История вопроса. Прогон в CI месяцами выходил зелёным, НЕ запустившись:
      # тест не умел падать при отсутствии браузера. Научили падать — и он
      # начал честно краснеть. Дальше три догадки подряд оказались мимо:
      # snap-обёртка, форма ключа headless, админские политики (последних на
      # раннере просто нет, лог это показал). Что установлено замерами:
      # предустановленный Google Chrome 152 стартует, создаёт полный профиль
      # с расширениями — и НЕ открывает порт отладки, не говоря об этом ни
      # слова. Гадать дальше дорого.
      # Берём Chrome for Testing — официальную сборку Google ровно для
      # автоматизации, закреплённую версией. Это та же ветка 141, на которой
      # прогон проходит локально, то есть CI перестаёт отличаться от стенда.
      # ── ТОТ ЖЕ БРАУЗЕР, ЧТО НА СТЕНДЕ (23.09) ──
      # Разбор истории прогонов: с 11.09 задача «browser» красная на КАЖДОМ
      # пуше (больше тридцати подряд) — Chrome for Testing 141 на раннере
      # стартует, но DevToolsActivePort не пишет, и три догадки до этого
      # ушли в пустоту. А до 11.09 задача зеленела, не запустив браузер.
      # То есть браузерные правила в CI не работали НИКОГДА. Локальный стенд
      # всё это время ходил на Chromium из Playwright 1.56.1 (сборка 1194,
      # Chromium 141.0.7390.37) — это и есть «та же ветка 141», а не CfT.
      # Ставим ровно его: версия закреплена, пакет известный, только CI —
      # в рантайм приложения ничего не попадает. --with-deps ставит
      # системные библиотеки раннера. Если и он не откроет порт — тест
      # скажет это вслух, а не промолчит.
      - name: браузер (Chromium из Playwright 1.56.1 — тот же, что на стенде)
        run: |
          npx --yes playwright@1.56.1 install --with-deps chromium
          BIN="$(find "$HOME/.cache/ms-playwright" -path '*chromium-*/chrome-linux/chrome' -type f | head -1)"
          test -x "$BIN"
          echo "BV_CHROME=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version
      - name: сборка dist (тесты читают его, а не исходник)
        run: node tests/build.js
      - name: настоящий браузер — экраны, листы, клавиатура
        run: node tests/browser.js
        env: { BV_REQUIRE_BROWSER: '1' }
      - name: настоящий браузер — заведомо битая база
        run: node tests/dirty.js
        env: { BV_REQUIRE_BROWSER: '1' }
